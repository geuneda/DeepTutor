short_description: "격리된 샌드박스에서 셸 명령을 실행하고 stdout/stderr와 종료 코드를 반환한다."
when_to_use: "데이터 처리, 스킬에 포함된 스크립트 실행, 작업에 필요한 CLI 도구 호출에 사용한다. 파괴적이거나 시스템을 관리하는 명령에는 쓰지 않는다."
input_format: "`command` — 셸 명령. 선택 사항으로 `timeout` — 초 단위(기본 30, 최대 300). 이번 턴의 워크스페이스 디렉터리에서 실행된다."
guideline: "비대화형 플래그(예: `-y`)를 쓴다. 출력을 짧게 유지하고, 출력이 많은 명령은 `head`/`grep`으로 걸러낸다. 스킬의 스크립트를 실행하기 전에 SKILL.md를 먼저 읽는다. 사용자가 파일 생성/내보내기를 요청했다면 명령을 실행해 워크스페이스에 파일을 저장한 뒤, 도구 결과에 있는 Generated artifacts URL을 최종 답변에 포함한다."
note: "파괴적인 패턴(rm -rf, mkfs, shutdown 등)은 차단된다. 샌드박스가 파일 시스템과 네트워크 접근을 제한하므로, 열린 인터넷이 필요한 명령은 실패할 수 있다."
phase: "expansion"
