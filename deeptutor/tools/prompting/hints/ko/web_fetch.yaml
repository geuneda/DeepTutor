short_description: "특정 URL을 가져와 읽을 수 있는 내용을 마크다운으로 추출한다."
when_to_use: "사용자의 메시지에 특정 URL이 들어 있고 그 페이지를 읽어야 할 때 사용한다: 블로그·교재·논문 링크를 공유하며 그에 대해 묻는 경우, 또는 '이 페이지 읽어줘'라는 명시적 요청. 일반적인 주제 검색에는 ``web_search``를 쓴다."
input_format: "{\"url\": \"전체 http(s):// URL\", \"max_chars\": 50000}. ``max_chars``는 선택 사항이며(기본 50000) 그 이상은 잘린다."
guideline: "로그인 장벽, 봇 차단, JS 전용 페이지는 쓸 만한 내용이 거의 없을 수 있다 — 그럴 땐 솔직히 말하고, 빈 결과를 두고 지어내지 않는다. 반환된 텍스트는 스크립트와 사이드바가 이미 걸러진 상태다(제목이 있으면 첫 줄이 `# 제목`)."
note: "file:// / localhost / 사설 IP 주소는 거부한다. 한 번에 URL 하나만 가져오므로 여러 개가 필요하면 호출을 나눈다."
phase: "exploration"
