short_description: "스킬의 전체 플레이북(SKILL.md)이나 스킬 패키지 안의 참고 파일을 읽는다."
when_to_use: "지금 작업이 지시문의 스킬 섹션에 있는 스킬과 맞아떨어질 때 사용한다. 작업을 시도하기 **전에** 스킬을 읽고, 그 지시를 따른다."
input_format: "`name` — 목록에 적힌 그대로의 스킬 이름. 선택 사항인 `file` — 패키지 내부 경로(예: `references/api.md`), 기본값은 SKILL.md."
guideline: "지금 작업에 관련된 스킬만 읽는다. SKILL.md가 필요한 변형에 대해 references/ 파일을 가리키고 있다면 행동하기 전에 그 파일도 읽는다."
note: "목록에 `(unavailable: ...)`로 표시된 스킬은 요구 조건이 충족되기 전까지 쓸 수 없다 — 추측하지 말고 그 사실을 밝힌다."
phase: "exploration"
