short_description: "수학 문제 이미지를 분석해 기하 시각화를 위한 검증된 GeoGebra 명령을 생성한다."
when_to_use: "사용자가 기하 도형이나 수학 그림을 올리고 이를 GeoGebra에서 재현하거나 시각화하거나 조작해 보고 싶어 할 때 사용한다."
input_format: "수학 문제 텍스트(question). 이미지는 첨부 파일에서 자동으로 주입된다."
guideline: "이미지 첨부가 있고 문제가 기하 도형을 다룰 때만 호출한다. 이 도구는 4단계 파이프라인(감지 → 분석 → 스크립팅 → 검토)을 모두 거쳐 바로 렌더링 가능한 GeoGebra 명령을 반환한다. 도구 결과에 ```ggbscript[…]``` 코드 블록이 들어 있으면 그 블록 전체를 최종 답변에 그대로 옮겨야 채팅 화면이 인터랙티브 도형을 그릴 수 있다."
note: "이 파이프라인에는 비전을 지원하는 LLM이 필요하다. LLM 호출이 네 번 연달아 일어나므로 처리에 15~30초가 걸릴 수 있다."
phase: "exploration"
