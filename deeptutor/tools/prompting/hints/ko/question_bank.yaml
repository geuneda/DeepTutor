short_description: "학습자의 문제 은행을 읽고 정리한다 — 학습 공간 → 문제 은행에 있는 채점된 퀴즈 문제를 다루며, 노트북과는 다르다."
when_to_use: "학습자가 자기 문제, 오답, 실수, 문제 세트를 이야기할 때 사용한다: 복습하기, 묶기, 세트에 넣기, 정리하기. action='overview'(개수 + 기존 분류 이름)로 시작해 action='list'로 항목 id를 얻고, action='organize'로 그 id들을 분류 이름 아래에 넣는다. 이 일에 `write_note`를 쓰지 않는다 — 노트는 산문이고 문제 은행은 채점된 문제이며, 오답을 노트북에 넣는 것은 잘못된 저장소를 고르는 것이다."
input_format: "overview: {\"action\": \"overview\"}. list: {\"action\": \"list\", \"filter\": \"wrong\" | \"uncategorized\" | \"bookmarked\" | \"all\", \"category\": 이름(선택), \"search\": 텍스트(선택), \"limit\": 선택}. organize / 분류 해제: {\"action\": \"organize\", \"entry_ids\": [12, 15], \"category\": \"미적분 오답\"}. bookmark: {\"action\": \"bookmark\", \"entry_ids\": [12], \"bookmarked\": true}."
guideline: "`entry_ids`는 `list` 호출이 [대괄호]로 보여준 번호다 — 절대 지어내지 말고 항상 먼저 목록을 확인한다. `organize`는 이름이 새로우면 분류를 함께 만들어 주므로, 오답을 새 세트에 넣어 달라는 요청은 organize 한 번이면 되고 만들기-넣기 두 단계가 아니다. 이미 맞는 분류가 있으면(overview가 보여준다) 비슷한 이름을 새로 만들지 말고 그 이름을 그대로 쓴다. filter='uncategorized'는 미분류 보관함이며 '문제 은행 좀 정리해 줘'의 출발점이다."
note: "문제 은행에 실제로 항목이 있을 때만 자동으로 사용된다. 변경 사항은 즉시 반영되어 학습자가 학습 공간 → 문제 은행에서 바로 확인할 수 있다. 실제로 일어난 일을 그대로 전한다 — 결과에 몇 개가 정리되었는지, 새 분류가 만들어졌는지가 담겨 있다."
phase: "synthesis"
