short_description: "연결된 자료(노트북 기록, 책 페이지, 대화 기록 세션, 문제 은행 항목, 문서 첨부)의 전문을 목록의 id로 불러온다."
when_to_use: "\"연결된 자료\" 목록에 보이는 미리보기만으로는 사용자의 질문에 답할 수 없을 때만 호출한다. 미리보기로 이미 충분한 자료를 다시 불러오지 않는다."
input_format: "{\"source_id\": \"목록에 있는 정확한 id(예: nb-... / bk-... / hs-... / qb-... / at-...)\"}."
guideline: "source_id는 목록에서 그대로 옮겨 적는다 — 절대 지어내거나 추측하지 않는다. 한 번에 하나씩 불러오고, 여러 자료가 필요하면 호출을 나눈다."
note: "연결된 자료가 없으면 이 도구는 나타나지 않는다. 사용자에게 \"어떤 자료를 말씀하시나요\"라고 되묻지 않는다."
phase: "exploration"
