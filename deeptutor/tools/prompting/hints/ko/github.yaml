short_description: "`gh` CLI로 GitHub PR / 이슈 / 저장소 / CI 실행을 읽기 전용으로 조회한다."
when_to_use: "사용자가 특정 GitHub 리소스를 물을 때 사용한다: '이 PR의 CI가 통과했나', 'owner/repo의 최근 이슈는', '이 릴리스의 변경 내역 보여줘'. **일반적인 코드 개념 질문에는 쓰지 않는다** — 그런 질문은 학습된 지식이나 ``web_search``로 답한다."
input_format: "{\"query_type\": \"pr|issue|run|repo|api\", \"target\": \"owner/repo[#번호] 또는 전체 URL. query_type이 api이면 상대 gh api 경로\"}."
guideline: "구조상 읽기 전용이라 댓글, 종료, 병합을 할 수 없다. 쓰기 작업은 사용자가 GitHub에서 직접 하도록 안내한다. 출력은 JSON이므로 그대로 쏟아내지 말고 필요한 필드만 뽑아 답한다."
note: "서버에 `gh` CLI가 없으면 도구가 명확한 오류를 반환한다 — GitHub 상태를 지어내지 말고 그 사실을 그대로 전한다."
phase: "exploration"
