short_description: "학술적 배경과 최신 방법론을 찾기 위해 arXiv 프리프린트를 검색한다."
when_to_use: "연구 논문, 최신 기법, 인용할 학술 자료가 필요할 때 사용한다. 일반적인 교재 수준의 질문에는 쓰지 않는다."
input_format: "**영어 단어 3개 이내**(예: `agent harness`, `LLM benchmark`). 완전한 문장, 4단어 이상의 질의, 명사구를 여러 개 이어 붙인 형태는 금지."
guideline: "paper_search는 arXiv만 다룬다. 결과가 없을 때 질의를 계속 고쳐 쓰지 말고 web_search로 바꾸거나 FINISH한다."
note: "arXiv 전용이라 산업계에서만 쓰는 용어는 결과가 없을 수 있다."
phase: "expansion"
