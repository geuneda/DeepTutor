short_description: "연결된 지식 베이스가 담고 있는 문서 목록과 총 개수를 보여준다."
when_to_use: "지식 베이스의 내용이 아니라 지식 베이스 자체에 대한 질문에 사용한다 — 파일이 몇 개인지, 이름이 무엇인지, 특정 문서가 들어 있는지, 무엇을 업로드했는지."
input_format: "{\"kb_name\": \"연결된 지식 베이스 이름 중 하나\", \"pattern\": \"'*.pdf' 같은 glob 또는 부분 문자열(선택)\", \"limit\": \"나열할 최대 개수(선택)\"}."
guideline: "개수나 파일 존재 여부를 rag 결과로 답하지 않는다 — 검색은 질의에 걸린 것만 보여줄 뿐 컬렉션의 크기에 대해서는 아무것도 말해주지 않는다. 시스템 프롬프트의 지식 베이스 목록에 이미 개수가 들어 있으니, 전체 목록이 필요하거나 이름으로 걸러야 할 때 이 도구를 호출한다."
note: "개수는 지식 베이스에 저장된 파일을 기준으로 한다. 색인이 준비되지 않은 지식 베이스도 문서 목록은 보여주지만, 원격 서버에 있는 지식 베이스는 목록을 아예 볼 수 없다 — 어느 쪽이든 사실 그대로 전한다."
phase: "exploration"
