short_description: "노트북 기록을 새로 저장하거나 기존 기록을 수정한다. mode='append'(새로 추가) 또는 'edit'(기존 수정)."
when_to_use: "append: 사용자가 저장을 명시적으로 요청했거나, 이번 턴에서 남겨둘 만한 완결된 설명이 나왔을 때. 퀴즈 문제나 오답을 정리하는 일은 `question_bank`의 몫이지 노트북 기록이 아니다. edit: 사용자가 전에 저장한 기록을 고치거나 보태거나 바로잡아 달라고 할 때. edit을 하려면 올바른 record_id를 얻기 위해 항상 `list_notebook`을 먼저 실행한다."
input_format: "append: {\"mode\": \"append\", \"notebook_id\": \"...\", \"title\": \"...\", \"turns_to_include\": \"3\" | \"all\", \"note\": \"선택\"}. edit: {\"mode\": \"edit\", \"notebook_id\": \"...\", \"record_id\": \"...\", \"title\": 선택, \"content\": 선택, \"note\": 선택}. append 모드에서는 본문을 직접 쓰지 않는다 — 도구가 실제 대화 내용을 알아서 넣는다. 에이전트가 작성한 요약을 일부러 저장하고 싶을 때만 `content`를 넘긴다."
guideline: "`turns_to_include`의 기본값은 3이다. 사용자가 '이 대화 전체를 저장해 줘'라고 하면 'all'을 쓴다. notebook id나 record id를 절대 지어내지 않는다 — 스키마의 enum이 유효한 notebook_id를 알려주고, record id는 `list_notebook`이 알려준다. 선택 사항인 `note`는 짧은 코멘트('왜 중요한지', '기억해 둘 맥락')이지 본문이 아니다."
note: "사용자에게 노트북이 하나 이상 있을 때만 자동으로 사용된다. 성공하면 결과에 대상 노트북 이름과 기록 id가 담기니 확인차 사용자에게 알려준다. 수정한 경우에는 어떤 항목이 바뀌었는지가 결과에 담긴다."
phase: "synthesis"
