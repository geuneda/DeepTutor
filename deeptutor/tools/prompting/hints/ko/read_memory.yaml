short_description: "사용자의 장기 메모리를 읽는다: 최근 학습 요약, 프로필, 지식 범위, 명시적으로 밝힌 선호 사항."
when_to_use: "답변의 어조, 깊이, 예시, 추천을 이 사용자에게 맞춰 조정할 여지가 있을 때 사용한다. 순수한 사실 확인, 계산, 번역 질문에는 쓰지 않는다."
input_format: "파라미터 없음. 네 개의 L3 문서를 모두 이어 붙여 반환한다."
guideline: "한 턴에 최대 한 번만 호출한다. 메모리는 '어떻게' 설명할지를 정하는 데 쓴다 — 예시, 깊이, 후속 질문. 메모리를 사실인 양 사용자에게 되읊지 않는다."
note: "사용자가 아직 메모리를 쌓지 않았다면 `(No memory available...)` 안내가 돌아온다 — 일반적인 질문으로 취급한다."
phase: "exploration"
