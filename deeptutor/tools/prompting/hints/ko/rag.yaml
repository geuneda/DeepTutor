short_description: "연결된 지식 베이스 중 하나에서 관련 있는 내용을 검색한다."
when_to_use: "정답이 연결된 지식 베이스에 담겨 있을 가능성이 높을 때 사용한다 — 정의, 공식, 개념, 교재 설명 등."
input_format: "{\"query\": \"비어 있지 않은 자연어 질의\", \"kb_name\": \"연결된 지식 베이스 이름 중 하나\"}."
guideline: "강의 자료와 관련된 질문이라면 외부 검색보다 RAG를 먼저 쓴다. 여러 지식 베이스를 함께 보려면 kb_name마다 rag를 한 번씩 호출한다(시스템이 병렬로 실행한다)."
note: "query는 비어 있으면 안 된다. 첫 검색 결과가 부실하면 포기하기 전에 다른 각도로 질의를 바꿔 본다."
phase: "exploration"
