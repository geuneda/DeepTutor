short_description: "사용자의 노트북을 확인하거나(인자 없음 → 목록) 한 노트북 안의 기록을 확인한다(notebook_id → 상세)."
when_to_use: "편집 모드의 `write_note`를 호출하기 전에 유효한 record id를 확보하려면 먼저 호출한다. 사용자가 노트북을 설명으로만 언급해 정확한 id가 필요할 때, 또는 여러 단계에 걸친 저장을 계획할 때도 유용하다."
input_format: "목록은 {}, 한 노트북의 기록을 보려면 {\"notebook_id\": \"시스템 프롬프트의 노트북 목록이나 앞선 호출에서 얻은 id\"}."
guideline: "목록 모드는 id + 이름 + 기록 수를, 상세 모드는 기록 id + 제목 + 요약 + 날짜를 보여준다(최신순, 약 80개까지). 시스템 프롬프트에 이미 보이는 노트북 이름을 확인하려고 list_notebook을 부르지 않는다 — 편집할 기록 id를 알아내거나 사용자가 노트북을 새로 추가한 뒤처럼 정말 최신 정보가 필요할 때만 호출한다."
note: "사용자에게 노트북이 하나 이상 있을 때만 자동으로 사용된다. 출력이 마크다운이라 일부를 그대로 인용해 사용자에게 전달할 수 있다."
phase: "exploration"
