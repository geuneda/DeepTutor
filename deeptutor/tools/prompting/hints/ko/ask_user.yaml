short_description: "루프를 멈추고 카드 하나에 1~4개의 확인 질문을 던진다. 각 질문에는 클릭 가능한 선택지 2~4개(라벨 + 설명)와 자유 입력란이 함께 제공된다."
when_to_use: "요청, 대화, 첨부 자료, 합리적인 기본값 중 어느 것으로도 결정할 수 없고 사용자만 정할 수 있는 사안에서 막혔을 때만 사용한다(예: 사용자의 수준/학년에 따라 설명 깊이가 달라짐, 질문의 지시 대상이 모호함, 여러 합리적 경로가 크게 갈림). \"진행할까요?\"를 묻거나, 사용자가 이미 말한 내용을 재확인하거나, 관례적인 답이 뻔한 선택을 묻는 데는 절대 쓰지 않는다 — 그런 경우엔 그 답을 골라 응답에 언급하고 진행한다. **어시스턴트 메시지당 `ask_user`는 최대 한 번**: 확인할 내용을 모두 그 한 번의 호출의 `questions` 목록(최대 4개)에 묶는다. 여러 `ask_user` tool_call을 동시에 내보내면 안 된다 — 카드가 중복되는 것은 중복 확인이 아니라 버그다."
input_format: |
  {"intro": "선택 사항인 한 줄 도입부", "questions": [
    {"id": "audience", "header": "대상", "prompt": "이 발표는 누구를 위한 것인가요?",
     "options": [
       {"label": "경영진 (추천)", "description": "결론부터, 간결하게"},
       {"label": "엔지니어링 팀", "description": "기술적 세부 사항과 구현"},
       {"label": "외부 고객", "description": "가치 제안, 다듬어진 비주얼"}
     ]},
    {"id": "focus", "header": "초점", "prompt": "어떤 영역을 다뤄야 하나요?", "multi_select": true,
     "options": [{"label": "결과"}, {"label": "방법론"}, {"label": "다음 단계"}]}
  ]}
  규칙: 질문마다 서로 배타적인 선택지를 2~4개 둔다 — `label`은 짧게(1~5단어), `description`은 그 선택이 뜻하는 바를 설명한다. 추천하는 선택지가 있으면 맨 앞에 두고 라벨 뒤에 " (추천)"을 붙인다. 선택지를 함께 고를 수 있으면 `multi_select: true`로 두고 질문도 그에 맞게 쓴다. `header`는 아주 짧은 탭 라벨이다(최대 12자). "기타" 선택지는 직접 만들지 않는다 — 카드가 자유 입력란을 자동으로 제공한다.
guideline: "이 호출 이후 루프는 사용자가 답할 때까지 **멈췄다가**, **같은 턴에서 이어서 진행된다**. 사용자의 답변은 대응하는 도구 결과로 들어오며 내용이 ``User answered:``로 시작하고 질문마다 ``- <질문>\\n  → <답변>`` 한 줄씩 이어진다(다중 선택은 쉼표로 이어붙는다). 이걸 보면 반드시 사용자의 원래 요청을 계속 처리해야 한다 — 필요하면 도구를 더 호출하고, 마지막에 알맹이 있는 ``FINISH``로 끝낸다. ask_user를 턴의 끝으로 **취급하지 않는다** — 한 줄짜리 확인 응답은 최종 답변이 될 수 없다."
note: "건너뛴 질문은 ``(skipped)``로 들어온다. 사용자가 선택지 대신 자유 입력으로 답할 수 있으며, 그 답을 우선한다. 사용자는 정지 버튼으로 이 대기 상태를 취소할 수도 있다(턴 전체가 취소된다)."
phase: "exploration"
