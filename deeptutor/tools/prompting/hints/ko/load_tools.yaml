short_description: "확장 도구(예: MCP 서버 도구)를 불러와 이번 세션에서 호출할 수 있게 한다."
when_to_use: "확장 도구 섹션에 있지만 아직 불러오지 않은 도구가 작업에 필요할 때 사용한다. 불러오지 않은 확장 도구를 호출하면 실패한다."
input_format: "`names` — 확장 도구 섹션에 적힌 정확한 도구 이름의 배열."
guideline: "목록 전체가 아니라 지금 작업에 필요한 도구만 불러온다. 한 번 불러온 도구는 세션이 끝날 때까지 유지되므로 다시 불러오지 않는다."
note: "이름이 알 수 없는 것으로 돌아오면 확장 도구 섹션에서 정확한 철자를 다시 확인한다."
phase: "exploration"
