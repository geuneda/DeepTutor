short_description: "하나의 LLM 호출로 주제에 대한 여러 방향을 폭넓게 탐색한다."
when_to_use: "해결책을 정하기 전에 아이디어를 넓게 펼치거나, 다른 관점을 찾거나, 초기 단계의 선택지를 만들어야 할 때 사용한다."
input_format: "자연어로 표현한 주제나 목표, 그리고 선택적으로 맥락이나 제약 조건."
guideline: "깊은 연역보다 폭이 중요할 때, 그리고 가벼운 근거와 함께 실현 가능한 방향을 여러 개 얻고 싶을 때 brainstorm을 택한다."
note: "좋은 프롬프트에는 목적, 대상, 제약, 어떤 종류의 아이디어가 가장 쓸모 있을지가 담긴다."
phase: "ideation"
