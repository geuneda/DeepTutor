short_description: "사용자가 명시한 선호 사항을 장기 메모리에 저장한다. 사용자가 *분명히* 선호를 밝혔을 때만 동작한다."
when_to_use: "사용자가 선호를 직접 말했을 때 — 문체, 언어, 형식, 깊이, 후속 질문 빈도 등 앞으로도 이어가길 원하는 것. 추측하지 않으며, 상황에 따른 한마디를 선호로 넘겨짚지 않는다."
input_format: "{\"op\": \"add\"|\"edit\", \"text\": \"사용자의 표현 그대로 240자 이내\", \"target_id\"?: \"edit일 때 m_xxx\", \"reason\"?: \"선택적 메모\"}"
guideline: "답변에서 선호를 짧게 확인해 주고('알겠습니다 — 앞으로 간결하게 답할게요') 나서 이 도구를 호출한다. 자연스럽다면 사용자의 말을 「그대로」 인용하는 편이 좋다. 선호 하나당 한 번 호출하며, 관련 없는 선호를 한 텍스트에 묶지 않는다."
note: "L3 선호 문서에 기록한다. 다른 메모리 계층(최근 요약, 프로필, 지식 범위, 영역별 요약)은 사용자가 메모리 작업대에서 직접 통합하므로 그쪽에 쓰려고 하지 않는다."
phase: "execution"
