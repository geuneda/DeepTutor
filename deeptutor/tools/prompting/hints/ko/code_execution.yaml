short_description: "격리된 샌드박스에서 코드(python/c/cpp)를 실행하고 stdout/stderr를 반환한다."
when_to_use: "계산, 알고리즘 검증, 수치 확인이 암산보다 확실할 때 사용한다."
input_format: "`language`(python, c, cpp) + `code` — 바로 실행 가능한 완전한 소스. 선택 사항으로 `stdin`과 `timeout`(초, 기본 30)."
guideline: "완전한 소스를 직접 작성하고 결과를 stdout으로 출력한다. 코드 실행은 객관적 검증을 위한 것이지, 추론을 설명하는 일을 대신하지 않는다."
note: "`exec`와 동일한 OS 수준 격리 샌드박스의 이번 턴 워크스페이스에서 실행된다. 샌드박스 백엔드가 설정되지 않으면 사용할 수 없다. 생성한 파일을 작업 디렉터리에 저장하면 산출물로 노출된다."
phase: "verification"
aliases:
  - name: run_code
    description: "계산, 검증, 시각화를 위해 코드(python/c/cpp)를 실행한다."
    input_format: "`language` + `code`; 선택 사항으로 `stdin`, `timeout`."
    when_to_use: "객관적인 확인, 빠른 계산, 소규모 실험에 사용한다."
    phase: "verification"
